# Lightweight AssessGen — API only (optional Ollama container)

services:
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: assessgen-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_GENERATOR_MODEL: ${OLLAMA_GENERATOR_MODEL:-gemma4:e2b}
      OLLAMA_REVIEWER_MODEL: ${OLLAMA_REVIEWER_MODEL:-gemma4:12b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_GENERATOR_MODEL: ${OPENAI_GENERATOR_MODEL:-gpt-4.1-mini}
      OPENAI_REVIEWER_MODEL: ${OPENAI_REVIEWER_MODEL:-gpt-4.1-mini}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../backend/app:/app/app:ro
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: assessgen-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
