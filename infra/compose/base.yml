# Shared data services — start with: docker compose --profile data up -d

x-data-profiles: &data-profiles
  profiles:
    - data
    - backend
    - generate

services:
  postgres:
    <<: *data-profiles
    image: pgvector/pgvector:pg18
    container_name: assessgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assessgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessgen}
      POSTGRES_DB: ${POSTGRES_DB:-assessgen}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      # PG 18+ expects the mount at /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-assessgen} -d ${POSTGRES_DB:-assessgen}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    <<: *data-profiles
    image: redis:8-alpine
    container_name: assessgen-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    <<: *data-profiles
    image: minio/minio:latest
    container_name: assessgen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-assessgen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-assessgen-dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    <<: *data-profiles
    image: minio/mc:latest
    container_name: assessgen-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-assessgen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-assessgen-dev}
      S3_BUCKET: ${S3_BUCKET:-assessgen}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      echo 'bucket ready: '$$S3_BUCKET;
      "
    restart: "no"

volumes:
  pgdata:
  minio_data:
