# Isolated stack for manual/integration testing — alternate ports to avoid clashing with dev.
# Usage: docker compose -f docker-compose.yml -f infra/compose/test.yml --profile data up -d

services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"

  minio:
    ports:
      - "9002:9000"
      - "9003:9001"
