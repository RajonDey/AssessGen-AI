# Install: cd backend && uv sync --extra dev && cd .. && uv run --directory backend pre-commit install
# Run all:  pre-commit run --all-files

default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check app tests'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format --check app tests'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy app tests'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: import-linter
        name: import-linter
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: pytest-unit
        name: pytest unit
        entry: bash -c 'cd backend && uv run pytest tests/unit -q'
        language: system
        pass_filenames: false
        files: ^backend/
