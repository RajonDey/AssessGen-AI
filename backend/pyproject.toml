[project]
name = "assessgen-backend"
version = "0.2.0"
description = "Lightweight IELTS question generation API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "numpy>=2.0",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.16,<0.17",
]
tts = [
    "kokoro>=0.9.4",
    "soundfile>=0.13",
    "torch",
]

[tool.uv]
# Prefer CPU Torch wheels for local Intel demos (avoids multi‑GB CUDA deps).
default-groups = []
# Plain `uv sync` drops extras. Always: uv sync --extra tts  (otherwise Listening audio 503s).

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
