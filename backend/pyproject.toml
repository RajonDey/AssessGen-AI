[project]
name = "assessgen-backend"
version = "0.1.0"
description = "AssessGen AI — assessment content engine backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web & config
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy>=2.0.51,<2.1",
    "greenlet>=3.0",
    "alembic>=1.18,<2.0",
    "psycopg[binary,pool]>=3.3,<4.0",
    "pgvector>=0.5,<0.6",
    # AI orchestration
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "langchain-ollama>=1.1,<2.0",
    "langsmith>=0.10,<0.11",
    # Queue & cache — kombu[redis] (Celery broker) currently caps redis below 6.5;
    # revisit when Celery supports redis 8.x (docs target redis 8.1 for production).
    "celery[redis]>=5.6,<6.0",
    "redis>=5.0.2,<6.5",
    # Storage & security
    "boto3>=1.43,<2.0",
    "pyjwt>=2.10,<3.0",
    "argon2-cffi>=25.1",
    "python-slugify>=8.0",
    # Observability
    "structlog>=26.1,<27.0",
    "opentelemetry-api>=1.44,<2.0",
    "opentelemetry-sdk>=1.44,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "prometheus-client>=0.26,<1.0",
    # Quality / readability (L1 rules — pure local computation)
    "textstat>=0.7.13,<0.8",
    "wordfreq>=3.1,<4.0",
    "rapidfuzz>=3.14,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.1,<8.0",
    "testcontainers[postgres]>=4.15,<5.0",
    "hypothesis>=6.164,<7.0",
    "polyfactory>=3.3,<4.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3.0",
    "import-linter>=2.0",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "flower>=2.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
packages = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.modules.*"]
strict = true

[[tool.mypy.overrides]]
module = ["app.infrastructure.db.models.*"]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "textstat.*", "wordfreq.*", "rapidfuzz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.infrastructure.queue.celery_app",
    "app.infrastructure.queue.tasks.*",
    "app.services.generation_worker",
]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Architectural layers"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.workflows",
    "app.agents",
    "app.domain",
    "app.infrastructure",
]

[[tool.importlinter.contracts]]
id = "domain-purity"
name = "Domain layer performs no I/O"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.infrastructure",
    "sqlalchemy",
    "httpx",
    "redis",
    "celery",
    "langchain",
    "langgraph",
]

[[tool.importlinter.contracts]]
id = "gateway-monopoly"
name = "Only the gateway imports provider SDKs"
type = "forbidden"
source_modules = [
    "app.agents",
    "app.workflows",
    "app.services",
    "app.domain",
    "app.api",
]
forbidden_modules = [
    "langchain_ollama",
    "langchain_openai",
    "langchain_anthropic",
    "openai",
    "anthropic",
]

[[tool.importlinter.contracts]]
id = "reference-corpus-quarantine"
name = "Reference corpus is reachable only by the originality checker"
type = "forbidden"
source_modules = ["app.agents", "app.workflows", "app.modules"]
forbidden_modules = ["app.infrastructure.db.repositories.reference_documents"]
